<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melyne &amp; Ismaël — 2 octobre 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Les photos du mariage de Melyne &amp; Ismaël, 2 octobre 2026.">
<meta property="og:title" content="Melyne &amp; Ismaël — 2 octobre 2026">
<meta property="og:description" content="Les photos de notre mariage">
<meta property="og:image" content="https://www.ismael-boudjakdji.com/mariage/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/mariage/p/l/shooting-couple-109.jpg" media="(min-aspect-ratio: 1/1)">
<link rel="preload" as="image" href="/mariage/p/l/shooting-couple-112.jpg" media="(max-aspect-ratio: 1/1)">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1e1e1e;--mute:rgba(30,30,30,.6);--line:#ececec}
html{-webkit-text-size-adjust:100%}
body{font-family:Lato,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}

/* ---------- COVER ---------- */
.cover{position:relative;height:100vh;height:100svh;min-height:480px;overflow:hidden;background:#2b2a24;color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.04);opacity:0;transition:opacity 1.2s ease,transform 6s ease}
.cover picture{position:absolute;inset:0}
@media (min-aspect-ratio:1/1){.cover img{object-position:50% 38%}}
.cover img.on{opacity:1;transform:scale(1)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.cover .brand{position:absolute;z-index:2;top:66px;left:50px;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.cover .txt{position:absolute;z-index:2;left:60px;bottom:66px;right:320px}
.cover h1{font-family:Raleway,sans-serif;font-weight:700;font-size:52px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.cover .date{margin-top:22px;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase}
.cover .cta{position:absolute;z-index:2;right:60px;bottom:66px;border:1px solid rgba(255,255,255,.9);padding:12px 24px;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#fff;transition:background .25s,color .25s}
.cover .cta:hover{background:#fff;color:var(--ink)}

/* ---------- HEADER ---------- */
.bar{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:36px;height:76px;padding:0 24px;transition:box-shadow .2s}
.bar.shadow{box-shadow:0 1px 0 var(--line)}
.bar .id{flex:none;line-height:1}
.bar .id b{display:block;font-family:Raleway,sans-serif;font-weight:700;font-size:16.2px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.bar .id small{display:block;margin-top:6px;font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.tabs{flex:1;display:flex;gap:2px 22px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-family:Raleway,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.105em;text-transform:uppercase;color:var(--mute);padding:10px 0;white-space:nowrap;transition:color .2s}
.tabs button:hover,.tabs button.on{color:var(--ink)}
.tools{flex:none;display:flex;align-items:center;gap:4px}
.tools button{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;position:relative;transition:background .2s}
.tools button:hover{background:#f4f4f4}
.tools .cnt{position:absolute;top:4px;right:3px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--ink);color:#fff;font-size:8.5px;line-height:15px;text-align:center;display:none}
.tools .cnt.show{display:block}
.ico{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- GRID ---------- */
.sethead{padding:34px 24px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.sethead h2{font-family:Raleway,sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.sethead span{font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.sethead .dl{font-family:Raleway,sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:7px}
.sethead .dl:hover{color:var(--ink)}
.grid{display:flex;gap:8px;padding:16px 20px 40px;align-items:flex-start}
.col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{position:relative;background:#f3f2ef;overflow:hidden;cursor:zoom-in}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.ph img.ld{opacity:1}
.ph .acts{position:absolute;right:8px;bottom:8px;display:flex;gap:2px;opacity:0;transition:opacity .2s}
.ph:hover .acts,.ph .acts.keep{opacity:1}
.ph .acts button{width:30px;height:30px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 0 3px rgba(0,0,0,.45))}
.ph .acts .ico{width:17px;height:17px}
.ph .fav.on .ico{fill:#fff}
.empty{padding:80px 24px 120px;text-align:center;color:var(--mute);font-size:14px;line-height:1.7}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--line);padding:46px 24px 54px;text-align:center}
footer b{display:block;font-family:Raleway,sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
footer p{margin-top:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);line-height:2}

/* ---------- LIGHTBOX ---------- */
.lb{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column}
.lb.open{display:flex}
.lb .top{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px}
.lb .top .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lb .top .meta b{font-family:Raleway,sans-serif;font-weight:600;color:var(--ink);margin-right:10px}
.lb .top .tools button.on .ico{fill:var(--ink)}
.lb .stage{flex:1;position:relative;min-height:0;touch-action:pan-y}
.lb .stage img{position:absolute;inset:0;margin:auto;max-width:calc(100% - 140px);max-height:calc(100% - 30px);object-fit:contain;transition:opacity .25s}
.lb .stage img.fade{opacity:0}
.lb .nav{position:absolute;top:0;bottom:0;width:70px;display:grid;place-items:center;color:var(--ink);opacity:.55;transition:opacity .2s}
.lb .nav:hover{opacity:1}
.lb .prev{left:0}.lb .next{right:0}
.lb .nav .ico{width:28px;height:28px;stroke-width:1.2}
.lb .spin{position:absolute;inset:0;margin:auto;width:26px;height:26px;border:2px solid #ddd;border-top-color:#999;border-radius:50%;animation:sp .8s linear infinite;display:none}
.lb.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.lb .play.on .ico{fill:var(--ink)}

/* ---------- TOAST / MODAL ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:12.5px;letter-spacing:.03em;padding:12px 20px;opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.96);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal .box{width:100%;max-width:420px;text-align:center}
.modal h3{font-family:Raleway,sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.modal p{margin:14px 0 26px;font-size:13.5px;line-height:1.7;color:var(--mute)}
.modal .opt{display:block;width:100%;border:1px solid var(--ink);padding:14px;margin-top:10px;font-family:Raleway,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;transition:.2s}
.modal .opt:hover{background:var(--ink);color:#fff}
.modal .opt.ghost{border-color:transparent;color:var(--mute)}
.modal .opt.ghost:hover{background:none;color:var(--ink)}
.prog{height:2px;background:#eee;margin-top:22px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1100px){.bar{gap:24px}}
@media (max-width:860px){
  .cover .brand{top:34px;left:26px}
  .cover .txt{left:26px;right:26px;bottom:116px}
  .cover h1{font-size:34px}
  .cover .date{margin-top:14px}
  .cover .cta{left:26px;right:auto;bottom:44px}
  .bar{flex-wrap:wrap;height:auto;padding:14px 16px 0;gap:0}
  .bar .id{flex:1;padding-bottom:4px}
  .tabs{order:3;flex-basis:100%;padding:6px 0 4px;gap:20px}
  .tools button{width:36px;height:36px}
  .sethead{padding:24px 16px 0}
  .grid{gap:6px;padding:12px 12px 32px}.col{gap:6px}
  .ph .acts{opacity:1;right:4px;bottom:4px}
  .ph .acts .sh{display:none}
  .lb .stage img{max-width:100%;max-height:100%}
  .lb .nav{display:none}
  .lb .top{padding:0 6px 0 16px}
  .lb .top .meta b{display:block;margin:0 0 3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section class="cover" id="cover">
  <picture><source media="(min-aspect-ratio: 1/1)" srcset="/mariage/p/l/shooting-couple-109.jpg"><img id="coverImg" alt="Melyne et Ismaël" src="/mariage/p/l/shooting-couple-112.jpg"></picture>
  <div class="txt">
    <h1>Melyne &amp; Ismaël</h1>
    <div class="date">2 octobre 2026</div>
  </div>
  <a class="cta" href="#galerie" id="cta">Afficher la galerie</a>
</section>

<header class="bar" id="galerie">
  <div class="id"><b>Melyne &amp; Ismaël</b></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <button id="tFav" title="Mes favoris" aria-label="Mes favoris"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20.3s-7.5-4.6-9.3-9.2C1.5 8 3.4 4.5 6.9 4.5c2.1 0 3.7 1.2 5.1 3 1.4-1.8 3-3 5.1-3 3.5 0 5.4 3.5 4.2 6.6-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span class="cnt" id="favCnt">0</span></button>
    <button id="tDl" title="Télécharger" aria-label="Télécharger"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15"/></svg></button>
    <button id="tShare" title="Partager" aria-label="Partager"><svg class="ico" viewBox="0 0 24 24"><path d="M14 5l6 6-6 6M20 11h-8.5C7.4 11 4 14.4 4 18.5V19"/></svg></button>
    <button id="tPlay" title="Diaporama" aria-label="Diaporama"><svg class="ico" viewBox="0 0 24 24"><path d="M7.5 5.2v13.6L18.5 12z"/></svg></button>
  </div>
</header>

<main id="main">
  <div class="sethead"><h2 id="setTitle"></h2><button class="dl" id="setDl"><svg class="ico" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15"/></svg><span id="setCount"></span></button></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <b>Melyne &amp; Ismaël</b>
  <p>2 octobre 2026</p>
</footer>

<div class="lb" id="lb" aria-modal="true" role="dialog">
  <div class="top">
    <div class="meta" id="lbMeta"></div>
    <div class="tools">
      <button id="lbFav" title="Favori" aria-label="Favori"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20.3s-7.5-4.6-9.3-9.2C1.5 8 3.4 4.5 6.9 4.5c2.1 0 3.7 1.2 5.1 3 1.4-1.8 3-3 5.1-3 3.5 0 5.4 3.5 4.2 6.6-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg></button>
      <button id="lbDl" title="Télécharger la photo" aria-label="Télécharger la photo"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15"/></svg></button>
      <button id="lbShare" title="Partager" aria-label="Partager"><svg class="ico" viewBox="0 0 24 24"><path d="M14 5l6 6-6 6M20 11h-8.5C7.4 11 4 14.4 4 18.5V19"/></svg></button>
      <button id="lbPlay" class="play" title="Diaporama" aria-label="Diaporama"><svg class="ico" viewBox="0 0 24 24"><path d="M7.5 5.2v13.6L18.5 12z"/></svg></button>
      <button id="lbClose" title="Fermer" aria-label="Fermer"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="spin"></div>
    <img id="lbImg" alt="">
    <button class="nav prev" id="lbPrev" aria-label="Précédente"><svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
    <button class="nav next" id="lbNext" aria-label="Suivante"><svg class="ico" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
  </div>
</div>

<div class="modal" id="dlModal">
  <div class="box">
    <h3>Télécharger</h3>
    <p id="dlText"></p>
    <button class="opt" id="dlSet"></button>
    <button class="opt" id="dlFavs"></button>
    <button class="opt ghost" id="dlCancel">Annuler</button>
    <div class="prog" id="prog"><i></i></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/mariage/data.js"></script>
<script>
(function(){
const G=window.GALLERY, SETS=G.sets, $=id=>document.getElementById(id);
const BASE='/mariage/p/';
const ALL={}; SETS.forEach(s=>s.photos.forEach((p,i)=>ALL[p[0]]={id:p[0],w:p[1],h:p[2],set:s,i}));
const FAV_KEY='mi-mariage-favs';
let favs=new Set(); try{favs=new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]').filter(k=>ALL[k]))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem(FAV_KEY,JSON.stringify([...favs]))}catch(e){} $('favCnt').textContent=favs.size;$('favCnt').classList.toggle('show',favs.size>0)};
saveFavs();

/* cover */
const ci=$('coverImg'); const onCov=()=>ci.classList.add('on'); ci.complete?onCov():ci.addEventListener('load',onCov);
$('cta').addEventListener('click',e=>{e.preventDefault();$('galerie').scrollIntoView({behavior:'smooth'})});

/* tabs */
let cur=SETS[0], list=[];
const tabs=$('tabs');
SETS.forEach(s=>{const b=document.createElement('button');b.textContent=s.name;b.dataset.id=s.id;b.onclick=()=>show(s.id,true);tabs.appendChild(b)});

function setList(id){ if(id==='favoris') return [...favs].map(k=>ALL[k]).sort((a,b)=>SETS.indexOf(a.set)-SETS.indexOf(b.set)||a.i-b.i); const s=SETS.find(x=>x.id===id)||SETS[0]; return s.photos.map(p=>ALL[p[0]]) }

function show(id,scroll){
  cur = id==='favoris' ? {id:'favoris',name:'Mes favoris'} : (SETS.find(s=>s.id===id)||SETS[0]);
  list=setList(cur.id);
  [...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===cur.id));
  $('tFav').style.color = cur.id==='favoris' ? 'var(--ink)' : '';
  $('setTitle').textContent=cur.name;
  $('setCount').textContent=list.length+' photo'+(list.length>1?'s':'');
  $('setDl').style.display=list.length?'':'none';
  render();
  if(location.hash.slice(1).split('/')[0]!==cur.id) history.replaceState(null,'','#'+cur.id);
  if(scroll){const top=$('galerie').getBoundingClientRect().top+scrollY; if(Math.abs(scrollY-top)>2) scrollTo({top,behavior:scrollY<top?'smooth':'auto'});}
  const on=tabs.querySelector('.on'); if(on) tabs.scrollLeft=on.offsetLeft-tabs.offsetWidth/2+on.offsetWidth/2;
}

/* masonry grid */
const io='IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const im=e.target;im.src=im.dataset.src;io.unobserve(im)}}),{rootMargin:'900px 0px'}) : null;
let lastCols=0;
function ncols(){const w=innerWidth;return w<600?2:w<1000?3:4}
function render(){
  const g=$('grid'); g.innerHTML=''; lastCols=ncols();
  if(!list.length){g.innerHTML='<div class="empty" style="flex:1">Aucun favori pour le moment.<br>Touchez le cœur sur une photo pour la retrouver ici.</div>';return}
  const cols=[],hts=[];
  for(let c=0;c<lastCols;c++){const d=document.createElement('div');d.className='col';g.appendChild(d);cols.push(d);hts.push(0)}
  list.forEach((p,idx)=>{
    let c=0;for(let k=1;k<lastCols;k++) if(hts[k]<hts[c]-1) c=k;
    hts[c]+=p.h/p.w;
    const el=document.createElement('div');el.className='ph';el.style.paddingTop=(p.h/p.w*100)+'%';
    el.innerHTML='<img alt="" decoding="async"><div class="acts"><button class="fav'+(favs.has(p.id)?' on':'')+'" aria-label="Favori"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20.3s-7.5-4.6-9.3-9.2C1.5 8 3.4 4.5 6.9 4.5c2.1 0 3.7 1.2 5.1 3 1.4-1.8 3-3 5.1-3 3.5 0 5.4 3.5 4.2 6.6-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg></button><button class="dlb" aria-label="Télécharger"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15"/></svg></button><button class="sh" aria-label="Partager"><svg class="ico" viewBox="0 0 24 24"><path d="M14 5l6 6-6 6M20 11h-8.5C7.4 11 4 14.4 4 18.5V19"/></svg></button></div>';
    const im=el.firstChild; im.dataset.src=BASE+'t/'+p.id+'.jpg'; im.onload=()=>im.classList.add('ld');
    io?io.observe(im):(im.src=im.dataset.src);
    el.addEventListener('click',e=>{
      const b=e.target.closest('button');
      if(!b){openLb(idx);return}
      e.stopPropagation();
      if(b.classList.contains('fav')){toggleFav(p.id);b.classList.toggle('on',favs.has(p.id));if(cur.id==='favoris') show('favoris')}
      else if(b.classList.contains('dlb')) dlOne(p);
      else sharePhoto(p);
    });
    cols[c].appendChild(el);
  });
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(ncols()!==lastCols) render()},150)});

function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);saveFavs();toast(favs.has(id)?'Ajoutée à vos favoris':'Retirée de vos favoris')}

/* header shadow */
addEventListener('scroll',()=>{$('galerie').classList.toggle('shadow',$('galerie').getBoundingClientRect().top<=0&&scrollY>10)},{passive:true});

/* lightbox */
let li=0, playT=null;
const lb=$('lb'), lbImg=$('lbImg');
function openLb(i){li=i;lb.classList.add('open');document.body.style.overflow='hidden';draw();}
function closeLb(){stopPlay();lb.classList.remove('open');document.body.style.overflow='';history.replaceState(null,'','#'+cur.id)}
function draw(){
  const p=list[li]; if(!p) return;
  lb.classList.add('loading'); lbImg.classList.add('fade');
  const src=BASE+'l/'+p.id+'.jpg'; const pre=new Image();
  pre.onload=pre.onerror=()=>{ if(list[li]!==p) return; lbImg.src=src; lbImg.classList.remove('fade'); lb.classList.remove('loading'); };
  pre.src=src;
  $('lbMeta').innerHTML='<b>'+p.set.name+'</b>'+(li+1)+' / '+list.length;
  $('lbFav').classList.toggle('on',favs.has(p.id));
  [list[li+1],list[li-1]].forEach(n=>{if(n){const x=new Image();x.src=BASE+'l/'+n.id+'.jpg'}});
  history.replaceState(null,'','#'+cur.id+'/'+p.id);
}
const go=d=>{li=(li+d+list.length)%list.length;draw()};
$('lbPrev').onclick=()=>{stopPlay();go(-1)}; $('lbNext').onclick=()=>{stopPlay();go(1)};
$('lbClose').onclick=closeLb;
$('lbFav').onclick=()=>{const p=list[li];toggleFav(p.id);$('lbFav').classList.toggle('on',favs.has(p.id));if(cur.id==='favoris'){list=setList('favoris');render();if(!list.length)return closeLb();li=Math.min(li,list.length-1);draw()}else render()};
$('lbDl').onclick=()=>dlOne(list[li]);
$('lbShare').onclick=()=>sharePhoto(list[li]);
$('lbPlay').onclick=()=>playT?stopPlay():startPlay();
function startPlay(){if(!list.length)return;$('lbPlay').classList.add('on');playT=setInterval(()=>go(1),3800)}
function stopPlay(){clearInterval(playT);playT=null;$('lbPlay').classList.remove('on')}
$('tPlay').onclick=()=>{if(!list.length)return;openLb(0);startPlay()};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='ArrowRight'){stopPlay();go(1)}else if(e.key==='ArrowLeft'){stopPlay();go(-1)}else if(e.key==='Escape')closeLb()});
let sx=0,sy=0;const st=$('stage');
st.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
st.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){stopPlay();go(dx<0?1:-1)}else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLb()},{passive:true});
st.addEventListener('click',e=>{if(e.target===st)closeLb()});

/* favorites view */
$('tFav').onclick=()=>show(cur.id==='favoris'?SETS[0].id:'favoris',true);

/* share */
const link=p=>location.origin+'/mariage'+(p?'#'+p.set.id+'/'+p.id:'');
async function shareUrl(url,title){
  if(navigator.share){try{await navigator.share({title,url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Lien copié')}catch(e){prompt('Copiez ce lien :',url)}
}
function sharePhoto(p){shareUrl(link(p),'Melyne & Ismaël — '+p.set.name)}
$('tShare').onclick=()=>shareUrl(link(),'Melyne & Ismaël — Photos du mariage');

/* download */
const fname=p=>'Melyne-Ismael-'+p.id+'.jpg';
async function dlOne(p){
  const url=BASE+'l/'+p.id+'.jpg';
  try{
    const blob=await (await fetch(url)).blob();
    const file=new File([blob],fname(p),{type:'image/jpeg'});
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname(p);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){window.open(url,'_blank')}
}
function openDl(){
  const isFav=cur.id==='favoris';
  $('dlText').textContent='Téléchargez les photos dans un fichier .zip. Pour une seule photo, ouvrez-la puis touchez la flèche.';
  $('dlSet').textContent=isFav?'Mes favoris ('+list.length+')':cur.name+' ('+list.length+' photos)';
  $('dlSet').style.display=list.length?'':'none';
  $('dlFavs').textContent='Mes favoris ('+favs.size+')';
  $('dlFavs').style.display=(!isFav&&favs.size)?'':'none';
  $('prog').style.display='none';
  $('dlModal').classList.add('open');
}
$('tDl').onclick=openDl; $('setDl').onclick=openDl;
$('dlCancel').onclick=()=>{zipAbort=true;$('dlModal').classList.remove('open')};
$('dlSet').onclick=()=>zip(list,cur.id==='favoris'?'Melyne-Ismael-Favoris':'Melyne-Ismael-'+cur.name.replace(/\s+/g,'-'));
$('dlFavs').onclick=()=>zip(setList('favoris'),'Melyne-Ismael-Favoris');
let zipAbort=false;
function loadZip(){return window.JSZip?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function zip(items,name){
  if(!items.length)return; zipAbort=false;
  const bar=$('prog'),fill=bar.firstElementChild;bar.style.display='block';fill.style.width='2%';
  ['dlSet','dlFavs'].forEach(i=>$(i).disabled=true);
  try{
    await loadZip(); const z=new JSZip(); let done=0;
    const q=items.slice(); const worker=async()=>{while(q.length&&!zipAbort){const p=q.shift();const b=await (await fetch(BASE+'l/'+p.id+'.jpg')).blob();z.file(name.replace('Melyne-Ismael-','')+'/'+fname(p),b);done++;fill.style.width=(done/items.length*90)+'%'}};
    await Promise.all([worker(),worker(),worker(),worker()]);
    if(zipAbort)return;
    const out=await z.generateAsync({type:'blob',compression:'STORE'},m=>fill.style.width=(90+m.percent/10)+'%');
    const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=name+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    $('dlModal').classList.remove('open');toast('Téléchargement lancé');
  }catch(e){toast('Le téléchargement a échoué, réessayez.')}
  finally{['dlSet','dlFavs'].forEach(i=>$(i).disabled=false)}
}

/* toast */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
